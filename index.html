<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detector de escala tonal</title>
  <style>
body {
  font-family: Arial, sans-serif;
  max-width: 720px;
  margin: 20px auto;
  padding: 0 16px;
  background: #f4f4f4;
  color: #222;
}
h1 { margin-bottom: 0; }
.sub { margin-top: 4px; color: #666; }

.panel {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px 16px;
  margin: 12px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.panel > .etiqueta { width: 100%; }

button, select { padding: 8px 12px; font-size: 14px; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }

.estado { color: #555; font-style: italic; }
.etiqueta { font-size: 13px; color: #777; }
.grande { font-size: 40px; font-weight: bold; }
.mediano { font-size: 22px; }
.resultado { justify-content: space-around; text-align: center; }

/* Indicador de afinación: la aguja se mueve entre -50 y +50 cents */
.afinador {
  position: relative;
  width: 160px;
  height: 10px;
  background: linear-gradient(to right, #e57373, #81c784 45%, #81c784 55%, #e57373);
  border-radius: 5px;
  margin: 6px auto 0;
}
.aguja {
  position: absolute;
  top: -4px;
  left: 50%;
  width: 3px;
  height: 18px;
  background: #222;
}

.candidatas { width: 100%; font-size: 14px; color: #555; }

.histograma {
  width: 100%;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 140px;
}
.barra-contenedor {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  height: 100%;
}
.barra {
  width: 100%;
  background: #4a90d9;
  border-radius: 3px 3px 0 0;
  transition: height 0.15s;
}
.barra.en-escala { background: #43a047; }
.barra-nombre { font-size: 12px; margin-top: 4px; }

.pie { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h1>Detector de escala tonal</h1>
  <p class="sub">Autocorrelación + Web Audio API + Web Worker</p>

  <!-- Controles -->
  <section class="panel">
    <button id="btnMic">Usar micrófono</button>
    <button id="btnDetener" disabled>Detener</button>
    <button id="btnReiniciar">Reiniciar histograma</button>
  </section>

  <!-- Modo de prueba: genera una escala sintética para probar sin instrumento -->
  <section class="panel">
    <strong>Modo prueba:</strong>
    <select id="selTonica"></select>
    <select id="selModo">
      <option value="mayor">mayor</option>
      <option value="menor">menor</option>
    </select>
    <button id="btnPrueba">Tocar escala de prueba</button>
  </section>

  <p id="estado" class="estado">Presiona «Usar micrófono» o «Tocar escala de prueba».</p>

  <!-- Nota actual -->
  <section class="panel resultado">
    <div>
      <div class="etiqueta">Nota</div>
      <div id="nota" class="grande">—</div>
    </div>
    <div>
      <div class="etiqueta">Frecuencia</div>
      <div id="frecuencia" class="mediano">— Hz</div>
    </div>
    <div>
      <div class="etiqueta">Afinación</div>
      <div id="cents" class="mediano">— cents</div>
      <div class="afinador"><div id="aguja" class="aguja"></div></div>
    </div>
  </section>

  <!-- Escala estimada -->
  <section class="panel">
    <div class="etiqueta">Escala estimada</div>
    <div id="escala" class="grande">—</div>
    <div id="candidatas" class="candidatas"></div>
  </section>

  <!-- Histograma de las 12 notas -->
  <section class="panel">
    <div class="etiqueta">Histograma de notas (cuánto ha sonado cada una)</div>
    <div id="histograma" class="histograma"></div>
  </section>

  <p class="pie">Tiempo de análisis por bloque: <span id="tiempo">—</span> ms</p>

  <!-- ===== CÓDIGO DEL WEB WORKER (se ejecuta en otro hilo) ===== -->
  <script id="codigoWorker" type="text/js-worker">
// =====================================================================
// worker.js — WEB WORKER (hilo en segundo plano)
// Aquí está toda la matemática: RMS, autocorrelación, nota y escala.
// Las ecuaciones citadas, (5), (7), etc., son las del artículo.
// =====================================================================

const F_MIN = 50;              // Hz: nota más grave que buscamos
const F_MAX = 1000;            // Hz: nota más aguda que buscamos
const UMBRAL_RMS = 0.01;       // por debajo de esto se considera silencio
const UMBRAL_CLARIDAD = 0.5;   // el pico de r'[τ] debe ser al menos esto (descarta ruido)
const BLOQUES_ESTABLES = 3;    // una nota cuenta si se repite en 3 bloques seguidos

// Perfiles tonales de Krumhansl–Kessler (Tabla I del artículo)
const PERFIL_MAYOR = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88];
const PERFIL_MENOR = [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];
const NOMBRES = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];

// Estado que se conserva entre bloques
let histograma = new Array(12).fill(0);
let notaAnterior = null;
let contador = 0;

// ---------------------------------------------------------------------
// Paso 1: volumen (RMS), ecuación (12)
// ---------------------------------------------------------------------
function calcularRMS(x) {
  let suma = 0;
  for (let n = 0; n < x.length; n++) suma += x[n] * x[n];
  return Math.sqrt(suma / x.length);
}

// ---------------------------------------------------------------------
// Paso 2: autocorrelación, ecuaciones (5) a (8)
// Devuelve la frecuencia fundamental en Hz, o null si no hay un tono claro.
// ---------------------------------------------------------------------
function autocorrelacion(x, fs) {
  const N = x.length;
  const tauMin = Math.floor(fs / F_MAX);               // (6)
  const tauMax = Math.min(Math.ceil(fs / F_MIN), N - 2);

  // r[τ] = Σ x[n]·x[n+τ]                               (5)
  const r = new Float32Array(tauMax + 2);
  for (let tau = 0; tau <= tauMax + 1; tau++) {
    let suma = 0;
    for (let n = 0; n < N - tau; n++) suma += x[n] * x[n + tau];
    r[tau] = suma;
  }

  // Normalizar: r'[τ] = r[τ] / r[0]  →  r'[0] = 1
  const r0 = r[0];
  if (r0 === 0) return null;
  for (let tau = 0; tau < r.length; tau++) r[tau] /= r0;

  // a) Bajar desde τmin hasta el primer mínimo (salir del "pico trivial" de τ = 0)
  let tau = tauMin;
  while (tau < tauMax && r[tau + 1] < r[tau]) tau++;

  // b) Valor máximo en el resto del rango
  let maximo = -Infinity;
  for (let k = tau; k <= tauMax; k++) if (r[k] > maximo) maximo = r[k];
  if (maximo < UMBRAL_CLARIDAD) return null;            // no hay periodicidad clara

  // c) Primer pico que llegue al 90 % del máximo (evita errores de octava)
  let tauPico = -1;
  for (let k = tau + 1; k < tauMax; k++) {
    if (r[k] >= 0.9 * maximo && r[k] >= r[k - 1] && r[k] >= r[k + 1]) { tauPico = k; break; }
  }
  if (tauPico < 0) return null;

  // d) Interpolación parabólica para afinar el pico     (7)
  const a = r[tauPico - 1], b = r[tauPico], c = r[tauPico + 1];
  const den = a - 2 * b + c;
  const delta = den !== 0 ? 0.5 * (a - c) / den : 0;

  return fs / (tauPico + delta);                       // (8)
}

// ---------------------------------------------------------------------
// Paso 3: frecuencia → nota, ecuaciones (9) a (11)
// ---------------------------------------------------------------------
function frecuenciaANota(f0) {
  const m = Math.round(12 * Math.log2(f0 / 440) + 69); // (9)  número MIDI
  const clase = ((m % 12) + 12) % 12;                  // (10) 0 = Do ... 11 = Si
  const octava = Math.floor(m / 12) - 1;
  const fIdeal = 440 * Math.pow(2, (m - 69) / 12);
  const cents = 1200 * Math.log2(f0 / fIdeal);         // (11)
  return { midi: m, clase, octava, cents, nombre: NOMBRES[clase] };
}

// ---------------------------------------------------------------------
// Paso 4: estimar la escala (Krumhansl–Schmuckler), ecuaciones (13) y (14)
// ---------------------------------------------------------------------
function pearson(a, b) {
  const ma = a.reduce((s, v) => s + v, 0) / a.length;
  const mb = b.reduce((s, v) => s + v, 0) / b.length;
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < a.length; i++) {
    num += (a[i] - ma) * (b[i] - mb);
    da += (a[i] - ma) ** 2;
    db += (b[i] - mb) ** 2;
  }
  return da === 0 || db === 0 ? 0 : num / Math.sqrt(da * db);
}

function estimarEscala(h) {
  const notasDistintas = h.filter(v => v > 0).length;
  if (notasDistintas < 3) return null;                 // con 1 o 2 notas no se puede decidir

  const candidatas = [];
  for (let tonica = 0; tonica < 12; tonica++) {
    for (const [modo, perfil] of [['mayor', PERFIL_MAYOR], ['menor', PERFIL_MENOR]]) {
      // Girar el perfil para que su posición 0 caiga en la tónica candidata
      const girado = [];
      for (let c = 0; c < 12; c++) girado.push(perfil[(c - tonica + 12) % 12]);
      candidatas.push({ tonica, modo, correlacion: pearson(h, girado) });   // (13)
    }
  }
  candidatas.sort((p, q) => q.correlacion - p.correlacion);               // (14)
  return candidatas;   // [0] es la ganadora
}

// ---------------------------------------------------------------------
// Recepción de mensajes del hilo principal
// ---------------------------------------------------------------------
self.onmessage = (e) => {
  const msg = e.data;

  if (msg.tipo === 'reiniciar') {
    histograma = new Array(12).fill(0);
    notaAnterior = null;
    contador = 0;
    self.postMessage({ silencio: true, histograma, escala: null, tiempoMs: 0 });
    return;
  }

  if (msg.tipo !== 'bloque') return;

  const inicio = performance.now();
  const x = msg.bloque;
  const respuesta = { silencio: false, f0: null, nota: null, histograma, escala: null, tiempoMs: 0 };

  if (calcularRMS(x) < UMBRAL_RMS) {
    respuesta.silencio = true;
    notaAnterior = null;
    contador = 0;
  } else {
    const f0 = autocorrelacion(x, msg.fs);
    if (f0) {
      const nota = frecuenciaANota(f0);
      respuesta.f0 = f0;
      respuesta.nota = nota;

      // Regla de estabilidad: solo cuenta si se repite en bloques seguidos
      if (nota.midi === notaAnterior) contador++;
      else { notaAnterior = nota.midi; contador = 1; }
      if (contador >= BLOQUES_ESTABLES) histograma[nota.clase]++;
    }
  }

  respuesta.escala = estimarEscala(histograma);
  respuesta.tiempoMs = performance.now() - inicio;
  self.postMessage(respuesta);
};
  </script>

  <!-- ===== CÓDIGO DEL HILO PRINCIPAL ===== -->
  <script>
// =====================================================================
// main.js — HILO PRINCIPAL
// Se encarga de: capturar el audio, enviar bloques al Worker y mostrar
// los resultados en pantalla. NO hace cálculos pesados.
// =====================================================================

const NOMBRES = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];
const TAMANO_BLOQUE = 2048;   // N: muestras que se analizan cada vez
const SALTO = 1024;           // cada cuántas muestras se envía un bloque nuevo

let ctx = null;               // AudioContext
let analyser = null;          // AnalyserNode: nos da las muestras
let fuente = null;            // micrófono u osciladores de prueba
let streamMic = null;
let temporizador = null;
let workerOcupado = false;    // evita acumular mensajes si el Worker va lento

// ---------- 1. Crear el Web Worker ----------
// El código del Worker está en el <script id="codigoWorker"> de este mismo archivo.
// Como el navegador no lo ejecuta (su type no es JavaScript), lo leemos como texto,
// lo convertimos en un Blob (un "archivo" en memoria) y creamos el Worker desde ahí.
const codigoWorker = document.getElementById('codigoWorker').textContent;
const blobWorker = new Blob([codigoWorker], { type: 'application/javascript' });
const worker = new Worker(URL.createObjectURL(blobWorker));

worker.onmessage = (e) => {
  workerOcupado = false;
  mostrarResultado(e.data);
};

// ---------- 2. Preparar la Web Audio API ----------
function crearContexto() {
  if (!ctx) {
    ctx = new AudioContext();
    analyser = ctx.createAnalyser();
    analyser.fftSize = TAMANO_BLOQUE;   // el bloque que entrega tendrá 2048 muestras
  }
  return ctx.resume();
}

// ---------- 3. Bucle de captura ----------
// Cada SALTO muestras (~23 ms a 44 100 Hz) copiamos el bloque más reciente
// y lo mandamos al Worker.
function iniciarBucle() {
  detenerBucle();
  const intervaloMs = (SALTO / ctx.sampleRate) * 1000;

  temporizador = setInterval(() => {
    if (workerOcupado) return;            // si el Worker no ha terminado, saltamos este bloque

    const bloque = new Float32Array(TAMANO_BLOQUE);
    analyser.getFloatTimeDomainData(bloque);  // copia las últimas 2048 muestras

    workerOcupado = true;
    // El segundo argumento "transfiere" la memoria al Worker sin copiarla
    worker.postMessage(
      { tipo: 'bloque', bloque: bloque, fs: ctx.sampleRate },
      [bloque.buffer]
    );
  }, intervaloMs);
}

function detenerBucle() {
  if (temporizador) clearInterval(temporizador);
  temporizador = null;
}

// ---------- 4. Fuente: micrófono ----------
async function usarMicrofono() {
  try {
    await crearContexto();
    detenerFuente();

    // Desactivamos los filtros del navegador: alteran la señal de una nota musical
    streamMic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    fuente = ctx.createMediaStreamSource(streamMic);
    fuente.connect(analyser);   // micrófono → analizador (no a los parlantes, para evitar acople)

    iniciarBucle();
    setEstado(`Escuchando el micrófono (fs = ${ctx.sampleRate} Hz). Toca una escala despacio.`);
    document.getElementById('btnDetener').disabled = false;
  } catch (err) {
    setEstado('No se pudo acceder al micrófono: ' + err.message);
  }
}

// ---------- 5. Fuente: escala de prueba sintética ----------
// Genera una nota con armónicos (parecida a un instrumento) usando osciladores.
async function tocarEscalaPrueba() {
  await crearContexto();
  detenerFuente();
  worker.postMessage({ tipo: 'reiniciar' });

  const tonica = Number(document.getElementById('selTonica').value);
  const modo = document.getElementById('selModo').value;
  const patron = modo === 'mayor' ? [0, 2, 4, 5, 7, 9, 11, 12] : [0, 2, 3, 5, 7, 8, 10, 12];
  const midiBase = 60 + tonica;          // octava 4 (Do4 = 60)

  // Onda con armónicos de amplitud decreciente
  const real = new Float32Array([0, 0, 0, 0, 0, 0]);
  const imag = new Float32Array([0, 1, 0.6, 0.4, 0.25, 0.15]);
  const forma = ctx.createPeriodicWave(real, imag);

  const salida = ctx.createGain();
  salida.gain.value = 0.3;
  salida.connect(analyser);
  salida.connect(ctx.destination);      // también se escucha por los parlantes
  fuente = salida;

  const dur = 0.5;
  let t = ctx.currentTime + 0.1;
  for (const intervalo of patron) {
    const f = 440 * Math.pow(2, (midiBase + intervalo - 69) / 12);
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.setPeriodicWave(forma);
    osc.frequency.value = f;
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(1, t + 0.02);
    env.gain.linearRampToValueAtTime(0, t + dur - 0.05);
    osc.connect(env).connect(salida);
    osc.start(t);
    osc.stop(t + dur);
    t += dur;
  }

  iniciarBucle();
  document.getElementById('btnDetener').disabled = false;
  setEstado(`Tocando ${NOMBRES[tonica]} ${modo}...`);
  setTimeout(() => setEstado(`Terminó la escala de prueba (${NOMBRES[tonica]} ${modo}). ¿Acertó?`),
             (t - ctx.currentTime) * 1000 + 300);
}

function detenerFuente() {
  if (fuente) { try { fuente.disconnect(); } catch (_) {} fuente = null; }
  if (streamMic) { streamMic.getTracks().forEach(p => p.stop()); streamMic = null; }
}

function detenerTodo() {
  detenerBucle();
  detenerFuente();
  document.getElementById('btnDetener').disabled = true;
  setEstado('Detenido.');
}

// ---------- 6. Mostrar resultados ----------
function mostrarResultado(r) {
  if (!r.silencio) document.getElementById('tiempo').textContent = r.tiempoMs.toFixed(2);

  if (r.silencio || !r.nota) {
    document.getElementById('nota').textContent = '—';
    document.getElementById('frecuencia').textContent = '— Hz';
    document.getElementById('cents').textContent = '— cents';
  } else {
    document.getElementById('nota').textContent = r.nota.nombre + r.nota.octava;
    document.getElementById('frecuencia').textContent = r.f0.toFixed(1) + ' Hz';
    const c = Math.round(r.nota.cents);
    document.getElementById('cents').textContent = (c > 0 ? '+' : '') + c + ' cents';
    // Aguja: -50 cents = izquierda, +50 cents = derecha
    document.getElementById('aguja').style.left = (50 + r.nota.cents) + '%';
  }

  dibujarHistograma(r.histograma, r.escala);

  if (r.escala) {
    const e = r.escala[0];
    document.getElementById('escala').textContent = `${NOMBRES[e.tonica]} ${e.modo}`;
    document.getElementById('candidatas').textContent =
      'Candidatas: ' + r.escala.slice(0, 3)
        .map(c => `${NOMBRES[c.tonica]} ${c.modo} (${c.correlacion.toFixed(2)})`).join('  ·  ');
  } else {
    document.getElementById('escala').textContent = '—';
    document.getElementById('candidatas').textContent = 'Aún no hay suficientes notas.';
  }
}

function dibujarHistograma(h, escala) {
  const cont = document.getElementById('histograma');
  const maximo = Math.max(1, ...h);
  // Notas que pertenecen a la escala ganadora (para pintarlas de verde)
  let notasEscala = [];
  if (escala) {
    const p = escala[0].modo === 'mayor' ? [0, 2, 4, 5, 7, 9, 11] : [0, 2, 3, 5, 7, 8, 10];
    notasEscala = p.map(i => (escala[0].tonica + i) % 12);
  }
  cont.innerHTML = h.map((v, i) => `
    <div class="barra-contenedor">
      <div class="barra ${notasEscala.includes(i) ? 'en-escala' : ''}" style="height:${(v / maximo) * 100}%"></div>
      <div class="barra-nombre">${NOMBRES[i]}</div>
    </div>`).join('');
}

function setEstado(t) { document.getElementById('estado').textContent = t; }

// ---------- 7. Conectar botones ----------
document.getElementById('selTonica').innerHTML =
  NOMBRES.map((n, i) => `<option value="${i}">${n}</option>`).join('');
document.getElementById('btnMic').onclick = usarMicrofono;
document.getElementById('btnPrueba').onclick = tocarEscalaPrueba;
document.getElementById('btnDetener').onclick = detenerTodo;
document.getElementById('btnReiniciar').onclick = () => worker.postMessage({ tipo: 'reiniciar' });
dibujarHistograma(new Array(12).fill(0), null);
  </script>
</body>
</html>
